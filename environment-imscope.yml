# `imscope` env: the heavy per-system MD analysis (pipeline.run_analysis) and the
# publication figures (pipeline.figures, which need matplotlib + Pillow).
#
# ImmunoScope itself is NOT on conda/PyPI — it is the lab's analysis toolkit kept
# in the sibling repo `../Immunex`. After creating this env, install it editable:
#
#     conda activate imscope
#     pip install -e ../Immunex            # provides the `immunoscope` package
#
# The version served on each detail page is recorded in analysis.json `provenance`
# (ImmunoScope 0.1.0, commit cbb0ae2b). Pinned-known-good versions are noted in
# comments; the loose specs below let conda solve on a fresh machine.
name: imscope
channels:
  - conda-forge
dependencies:
  - python=3.11          # known-good: 3.11.15
  - numpy                # known-good: 2.4.6
  - scipy                # known-good: 1.17.1
  - pandas               # known-good: 3.0.3
  - matplotlib           # known-good: 3.10.9  (required by pipeline.figures)
  - pillow               # known-good: 12.2.0  (figure post-processing / thumbnails)
  - networkx             # known-good: 3.6.1
  - scikit-learn         # known-good: 1.9.0   (interface-state clustering)
  - seaborn              # known-good: 0.13.2
  - pip
