<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ImmunoScope Agent - Simple Interface</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 900px;
            height: 85vh;
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            font-size: 24px;
            font-weight: 600;
        }

        .status {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #4ade80;
            animation: pulse 2s infinite;
        }

        .status-dot.disconnected {
            background: #ef4444;
            animation: none;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        /* Simple file upload banner */
        .upload-banner {
            background: #f9fafb;
            border-bottom: 1px solid #e5e7eb;
            padding: 16px 30px;
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .upload-banner.has-files {
            background: #ecfdf5;
            border-bottom-color: #6ee7b7;
        }

        .upload-button {
            padding: 8px 16px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .upload-button:hover {
            transform: translateY(-1px);
        }

        .file-info {
            flex: 1;
            font-size: 14px;
            color: #6b7280;
        }

        .file-info.ready {
            color: #059669;
            font-weight: 500;
        }

        .file-input {
            display: none;
        }

        .clear-button {
            padding: 6px 12px;
            background: #fee2e2;
            color: #991b1b;
            border: none;
            border-radius: 6px;
            font-size: 13px;
            cursor: pointer;
        }

        .clear-button:hover {
            background: #fecaca;
        }

        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 30px;
            background: #f9fafb;
        }

        .message {
            margin-bottom: 20px;
            display: flex;
            gap: 12px;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.user {
            flex-direction: row-reverse;
        }

        .message-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 16px;
            flex-shrink: 0;
        }

        .message.user .message-avatar {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .message.agent .message-avatar {
            background: #e5e7eb;
            color: #374151;
        }

        .message-content {
            max-width: 70%;
            padding: 12px 16px;
            border-radius: 12px;
            line-height: 1.6;
            white-space: pre-wrap;
        }

        .message.user .message-content {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-bottom-right-radius: 4px;
        }

        .message.agent .message-content {
            background: white;
            color: #1f2937;
            border: 1px solid #e5e7eb;
            border-bottom-left-radius: 4px;
        }

        .tool-call {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 10px;
            background: #f3f4f6;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 13px;
            color: #6b7280;
            margin: 4px 0;
        }

        .tool-call.success {
            background: #d1fae5;
            border-color: #6ee7b7;
            color: #065f46;
        }

        .input-container {
            padding: 20px 30px;
            background: white;
            border-top: 1px solid #e5e7eb;
            display: flex;
            gap: 12px;
        }

        #messageInput {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid #e5e7eb;
            border-radius: 12px;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s;
            resize: none;
            font-family: inherit;
            line-height: 1.5;
        }

        #messageInput:focus {
            border-color: #667eea;
        }

        #sendButton {
            padding: 12px 24px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
        }

        #sendButton:hover:not(:disabled) {
            transform: translateY(-2px);
        }

        #sendButton:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .welcome-message {
            text-align: center;
            padding: 60px 20px;
            color: #6b7280;
        }

        .welcome-message h2 {
            font-size: 28px;
            color: #1f2937;
            margin-bottom: 12px;
        }

        .welcome-message p {
            font-size: 16px;
            line-height: 1.8;
            max-width: 600px;
            margin: 0 auto 30px;
        }

        .example-queries {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 12px;
            max-width: 700px;
            margin: 0 auto;
        }

        .example-query {
            padding: 12px 16px;
            background: white;
            border: 2px solid #e5e7eb;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 14px;
            color: #4b5563;
        }

        .example-query:hover {
            border-color: #667eea;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.2);
        }

        .typing-indicator {
            display: none;
            align-items: center;
            gap: 12px;
        }

        .typing-indicator.active {
            display: flex;
        }

        .typing-dots {
            display: flex;
            gap: 4px;
        }

        .typing-dots span {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #9ca3af;
            animation: bounce 1.4s infinite ease-in-out;
        }

        .typing-dots span:nth-child(1) { animation-delay: -0.32s; }
        .typing-dots span:nth-child(2) { animation-delay: -0.16s; }

        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🧬 ImmunoScope Agent</h1>
            <div class="status">
                <div class="status-dot" id="statusDot"></div>
                <span id="statusText">Connecting...</span>
            </div>
        </div>

        <!-- Simple upload banner -->
        <div class="upload-banner" id="uploadBanner">
            <button class="upload-button" onclick="document.getElementById('fileInput').click()">
                📤 Upload Files
            </button>
            <div class="file-info" id="fileInfo">
                Upload trajectory (.xtc, .trr) and topology (.tpr, .pdb, .gro)
            </div>
            <button class="clear-button" id="clearButton" style="display: none;" onclick="clearFiles()">
                Clear
            </button>
            <input type="file" id="fileInput" class="file-input" multiple
                   accept=".xtc,.tpr,.pdb,.gro,.trr,.dcd" onchange="handleFileSelect(event)">
        </div>

        <div class="chat-container" id="chatContainer">
            <div class="welcome-message">
                <h2>Welcome to ImmunoScope Agent</h2>
                <p>
                    Upload your trajectory and topology files, then simply tell me what you want to analyze.
                    I'll handle the rest automatically.
                </p>
                <div class="example-queries">
                    <div class="example-query" onclick="sendExample('分析这个轨迹的RMSD和RMSF')">
                        📊 分析RMSD和RMSF
                    </div>
                    <div class="example-query" onclick="sendExample('找出相互作用热点')">
                        🎯 找出热点残基
                    </div>
                    <div class="example-query" onclick="sendExample('计算界面埋藏表面积')">
                        🔬 计算BSA
                    </div>
                    <div class="example-query" onclick="sendExample('进行完整的相互作用分析')">
                        🧪 完整分析
                    </div>
                </div>
            </div>
        </div>

        <div class="input-container">
            <textarea
                id="messageInput"
                placeholder="告诉我你想做什么分析..."
                rows="1"
                onkeydown="handleKeyDown(event)"
            ></textarea>
            <button id="sendButton" onclick="sendMessage()">Send</button>
        </div>
    </div>

    <script>
        let ws = null;
        let sessionId = null;
        let uploadedFiles = {};
        let currentMessage = null;

        // Connect to WebSocket
        function connect() {
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const wsUrl = `${protocol}//${window.location.host}/api/agent/ws`;

            ws = new WebSocket(wsUrl);

            ws.onopen = () => {
                updateStatus('connected', 'Connected');
            };

            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                handleMessage(data);
            };

            ws.onclose = () => {
                updateStatus('disconnected', 'Disconnected');
                setTimeout(connect, 3000);
            };

            ws.onerror = (error) => {
                console.error('WebSocket error:', error);
                updateStatus('disconnected', 'Connection error');
            };
        }

        function updateStatus(status, text) {
            const dot = document.getElementById('statusDot');
            const statusText = document.getElementById('statusText');

            if (status === 'connected') {
                dot.classList.remove('disconnected');
            } else {
                dot.classList.add('disconnected');
            }

            statusText.textContent = text;
        }

        function handleMessage(data) {
            const chatContainer = document.getElementById('chatContainer');

            switch (data.type) {
                case 'session_info':
                    sessionId = data.session_id;
                    break;

                case 'text_delta':
                    if (!currentMessage) {
                        currentMessage = addMessage('agent', '');
                    }
                    currentMessage.textContent += data.text;
                    scrollToBottom();
                    break;

                case 'tool_use_start':
                    if (!currentMessage) {
                        currentMessage = addMessage('agent', '');
                    }
                    const toolBadge = document.createElement('div');
                    toolBadge.className = 'tool-call';
                    toolBadge.textContent = `🔧 ${data.name}`;
                    toolBadge.id = `tool-${data.id}`;
                    currentMessage.appendChild(toolBadge);
                    scrollToBottom();
                    break;

                case 'tool_use_end':
                    const badge = document.getElementById(`tool-${data.id}`);
                    if (badge) {
                        badge.classList.add(data.ok ? 'success' : 'error');
                        badge.textContent += data.ok ? ' ✓' : ' ✗';
                    }
                    break;

                case 'turn_complete':
                    currentMessage = null;
                    document.getElementById('sendButton').disabled = false;
                    break;

                case 'error':
                    addMessage('agent', `❌ Error: ${data.message}`);
                    currentMessage = null;
                    document.getElementById('sendButton').disabled = false;
                    break;
            }
        }

        function addMessage(role, content) {
            const chatContainer = document.getElementById('chatContainer');
            const welcome = chatContainer.querySelector('.welcome-message');
            if (welcome) welcome.remove();

            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${role}`;

            const avatar = document.createElement('div');
            avatar.className = 'message-avatar';
            avatar.textContent = role === 'user' ? 'U' : 'A';

            const contentDiv = document.createElement('div');
            contentDiv.className = 'message-content';
            contentDiv.textContent = content;

            messageDiv.appendChild(avatar);
            messageDiv.appendChild(contentDiv);
            chatContainer.appendChild(messageDiv);

            scrollToBottom();
            return contentDiv;
        }

        function sendMessage() {
            const input = document.getElementById('messageInput');
            const message = input.value.trim();

            if (!message || !ws || ws.readyState !== WebSocket.OPEN) return;

            // Add user message to chat
            addMessage('user', message);

            // Send to server
            ws.send(JSON.stringify({
                type: 'message',
                content: message,
                context: {
                    uploaded_files: uploadedFiles
                }
            }));

            input.value = '';
            document.getElementById('sendButton').disabled = true;
        }

        function sendExample(text) {
            document.getElementById('messageInput').value = text;
            sendMessage();
        }

        function handleKeyDown(event) {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                sendMessage();
            }
        }

        function handleFileSelect(event) {
            const files = Array.from(event.target.files);

            files.forEach(file => {
                const ext = file.name.split('.').pop().toLowerCase();
                if (['xtc', 'trr', 'dcd'].includes(ext)) {
                    uploadedFiles.trajectory = file.name;
                } else if (['tpr', 'pdb', 'gro'].includes(ext)) {
                    uploadedFiles.topology = file.name;
                }
            });

            updateFileInfo();

            // TODO: Actually upload files to server
            // For now, just show them as ready
        }

        function updateFileInfo() {
            const banner = document.getElementById('uploadBanner');
            const fileInfo = document.getElementById('fileInfo');
            const clearButton = document.getElementById('clearButton');

            if (uploadedFiles.trajectory && uploadedFiles.topology) {
                banner.classList.add('has-files');
                fileInfo.classList.add('ready');
                fileInfo.textContent = `✓ ${uploadedFiles.trajectory} + ${uploadedFiles.topology}`;
                clearButton.style.display = 'block';
            } else if (uploadedFiles.trajectory || uploadedFiles.topology) {
                fileInfo.textContent = `Uploaded: ${uploadedFiles.trajectory || uploadedFiles.topology} (need both files)`;
                clearButton.style.display = 'block';
            }
        }

        function clearFiles() {
            uploadedFiles = {};
            const banner = document.getElementById('uploadBanner');
            const fileInfo = document.getElementById('fileInfo');
            const clearButton = document.getElementById('clearButton');

            banner.classList.remove('has-files');
            fileInfo.classList.remove('ready');
            fileInfo.textContent = 'Upload trajectory (.xtc, .trr) and topology (.tpr, .pdb, .gro)';
            clearButton.style.display = 'none';
        }

        function scrollToBottom() {
            const chatContainer = document.getElementById('chatContainer');
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        // Initialize
        connect();
    </script>
</body>
</html>
