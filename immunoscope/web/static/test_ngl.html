<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>NGL test</title></head>
<body>
<div id="viewport" style="width: 600px; height: 400px; background: #1e2a24;"></div>
<div id="log" style="font-family: monospace; font-size: 12px;"></div>
<script src="/static/lib/ngl.js"></script>
<script>
const log = document.getElementById('log');
function p(msg) { log.innerHTML += msg + '<br>'; console.log(msg); }
p('NGL loaded: ' + (typeof NGL !== 'undefined'));
p('NGL.Stage: ' + typeof NGL.Stage);
try {
  const stage = new NGL.Stage('viewport', { backgroundColor: '#1e2a24' });
  p('Stage created');
  stage.loadFile('/api/design/jobs/705a7bfedccf/structure', { ext: 'pdb' }).then(c => {
    p('PDB loaded: ' + c.name);
    c.addRepresentation('cartoon', { color: '#cbd5e1' });
    c.addRepresentation('ball+stick', { sele: '99 and sidechainAttached', color: '#dc2626' });
    c.autoView();
    p('Done!');
  }).catch(e => p('Load error: ' + e));
} catch (e) {
  p('Stage error: ' + e);
}
</script>
</body>
</html>
