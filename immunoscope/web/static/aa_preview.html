<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>AA structures — Wikipedia textbook quality</title>
<style>
  body { font-family: 'Noto Sans', sans-serif; background: #f5f1e8; padding: 24px; color: #1e2a24; margin: 0; }
  h1 { color: #1c473c; margin: 0 0 4px; }
  .sub { color: #6f746d; font-size: 13px; margin-bottom: 24px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; }
  .card { background: #fffdfa; border: 1px solid #ddd5c7; border-radius: 14px; padding: 16px; text-align: center; box-shadow: 0 6px 14px rgba(29,37,32,0.06); }
  .code { font-family: ui-monospace, monospace; font-size: 32px; font-weight: 800; color: #255b4b; margin-bottom: 4px; }
  .name { font-size: 11px; color: #6f746d; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.1em; }
  .source { font-family: ui-monospace, monospace; font-size: 9px; color: #a36b00; margin-top: 8px; word-break: break-all; }
  img { display: block; margin: 0 auto; max-width: 180px; max-height: 140px; height: auto; filter: drop-shadow(0 2px 4px rgba(29,37,32,0.06)); }
</style>
</head>
<body>
<h1>20 Amino acids — Wikipedia SVG</h1>
<div class="sub">Public-domain chemical structures from Wikimedia Commons. Locally hosted where possible; remote-loaded otherwise.</div>
<div class="grid" id="grid"></div>

<script>
const AA_NAMES = {
  A:'Alanine', R:'Arginine', N:'Asparagine', D:'Aspartate', C:'Cysteine',
  E:'Glutamate', Q:'Glutamine', G:'Glycine', H:'Histidine', I:'Isoleucine',
  L:'Leucine', K:'Lysine', M:'Methionine', F:'Phenylalanine', P:'Proline',
  S:'Serine', T:'Threonine', W:'Tryptophan', Y:'Tyrosine', V:'Valine'
};
const grid = document.getElementById('grid');
Object.entries(AA_NAMES).forEach(([code, name]) => {
  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `
    <div class="code">${code}</div>
    <div class="name">${name}</div>
    <img src="/static/lib/aa_svg/${code}.svg" alt="${code}">
  `;
  grid.appendChild(card);
});
</script>
</body>
</html>
