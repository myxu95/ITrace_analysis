# `md-analysis` env: the heavy per-system MD analysis (pipeline.run_analysis)
# and the publication figures (pipeline.figures, which need matplotlib + Pillow).
#
# md_analysis ships in this repository as `md_analysis/` and is not on
# conda/PyPI; after creating this env, install it editable:
#
#     conda activate md-analysis
#     pip install -e ./md_analysis
#
# The version served on each detail page is recorded in each complex's
# analysis.json `provenance` as `md_analysis 0.1.0`. Pinned-known-good versions
# are noted in comments; the loose specs below let conda solve on a fresh
# machine.
name: md-analysis
channels:
  - conda-forge
dependencies:
  - python=3.11          # known-good: 3.11.15
  - numpy                # known-good: 2.4.6
  - scipy                # known-good: 1.17.1
  - pandas               # known-good: 3.0.3
  - matplotlib           # known-good: 3.10.9  (required by pipeline.figures)
  - pillow               # known-good: 12.2.0  (figure post-processing / thumbnails)
  - networkx             # known-good: 3.6.1
  - scikit-learn         # known-good: 1.9.0   (interface-state clustering)
  - seaborn              # known-good: 0.13.2
  - pip
